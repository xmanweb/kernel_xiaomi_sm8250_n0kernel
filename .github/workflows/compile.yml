name: Build Xiaomi SM8250 Kernel with Official KSU

on:
  workflow_dispatch: # 允许在 GitHub 网页上手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: 'recursive' # 自动拉取小米源码中可能存在的 Techpack 等驱动子模块

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
    - name: Download Proton Clang & AOSP GCC
      run: |
        # 1. 下载并解压 Proton Clang
        mkdir -p clang
        cd clang
        curl -LO https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
        tar -xzf master.tar.gz --strip-components=1
        rm master.tar.gz
        echo "$(pwd)/bin" >> $GITHUB_PATH
        cd ..

        # 2. 拉取谷歌官方 AOSP 64位 GCC (用于辅助汇编和驱动编译)
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 aosp-gcc64
        echo "$(pwd)/aosp-gcc64/bin" >> $GITHUB_PATH

        # 3. 拉取谷歌官方 AOSP 32位 GCC
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 aosp-gcc32
        echo "$(pwd)/aosp-gcc32/bin" >> $GITHUB_PATH

    # ==================== 核心：集成官方一键 KernelSU ====================
    - name: Setup Official KernelSU
      run: |
        echo "=== 正在全自动同步官方 KernelSU 源码 ==="
        # 使用官方一键脚本，直接将 KernelSU 源码安全地注入到 drivers/kernelsu 目录下
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

    # ==================== 核心：配置内核并编译 ====================
    - name: Build Kernel
      env:
        ARCH: arm64
        SUBARCH: arm64
        HEADER_ARCH: arm64
        CC: clang
        CLANG_TRIPLE: aarch64-linux-gnu-
        # 核心修改：对应刚刚下载的谷歌 AOSP GCC 的前缀
        CROSS_COMPILE: aarch64-linux-android-
        CROSS_COMPILE_ARM32: arm-linux-androideabi-
      run: |
        export KBUILD_BUILD_USER="xmanweb"
        export KBUILD_BUILD_HOST="GitHub-Actions"
        
        # 定义小米 SM8250 平台的默认配置文件名
        DEFCONFIG="vendor/lito-perf_defconfig"
        
        echo "=== 1. 生成基础 Defconfig ==="
        make O=out $DEFCONFIG
        
        echo "=== 2. 注入 KernelSU 必需的内核参数 ==="
        # 追加高通平台打包 dtb 必需的参数
        echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y" >> out/.config
        # 开启 KernelSU 核心开关
        echo "CONFIG_KSU=y" >> out/.config
        
        echo "=== 3. 开始多核并行编译 ==="
        make O=out -j$(nproc)

    # ==================== 产物检查与打包上传 ====================
    - name: Check and Prepare Artifact
      id: check_img
      run: |
        # 高通平台优先检查带 dtb 的 Image.gz-dtb，其次检查普通的 Image.gz
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            CP_PATH="out/arch/arm64/boot/Image.gz-dtb"
        elif [ -f out/arch/arm64/boot/Image.gz ]; then
            CP_PATH="out/arch/arm64/boot/Image.gz"
        else
            echo "::error::未找到编译生成的内核镜像，请检查上方编译日志是否报错！"
            exit 1
        fi
        echo "Found kernel image at: $CP_PATH"
        echo "img_path=$CP_PATH" >> $GITHUB_OUTPUT

    - name: Upload Kernel Image Artifact
      if: success() && steps.check_img.outputs.img_path != ''
      uses: actions/upload-artifact@v4
      with:
        name: Xiaomi-SM8250-OfficialKSU-Kernel
        path: ${{ steps.check_img.outputs.img_path }}
