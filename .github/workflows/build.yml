name: Build Xiaomi SM8250 Kernel

on:
  push:
    branches: [ "staging-umi" ]
  pull_request:
    branches: [ "staging-umi" ]
  workflow_dispatch: # 允许手动触发编译

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        ref: staging-umi
        fetch-depth: 1

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libelf-dev ccache flex bison libssl-dev libgmp-dev libmpfr-dev libmpc-dev libncurses-dev keyutils

    - name: Download Toolchains
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain
        cd $GITHUB_WORKSPACE/toolchain
        
        # 使用 git 浅克隆特定版本的 Clang，避免 wget 链接失效问题（下载较慢但版本标准）
        echo "Downloading AOSP Clang..."
        git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 --branch=master-kernel clang-llvm
        
        # 下载 GCC 64位 / 32位 交叉编译器
        echo "Downloading GCC..."
        git clone https://android.googlesource.com/platform/prebuilts/gas/linux-x86 --depth=1 gas
    - name: Set Environment Variables
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "HEADER_ARCH=arm64" >> $GITHUB_ENV
        
        # 将工具链路径加入环境变量
        CLANG_BIN="$GITHUB_WORKSPACE/toolchain/clang/bin"
        GCC_BIN="$GITHUB_WORKSPACE/toolchain/linux-x86/any/bin" # 或者是对应的 gas 路径
        echo "$CLANG_BIN" >> $GITHUB_PATH
        
        # 设置编译使用的 Make 参数
        echo "MAKE_ARGS=ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-androideabi- CC=clang CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        # 请根据仓库 arch/arm64/configs/ 下的实际 defconfig 文件名修改下面的 umi_defconfig
        # 常见命名如: umi_defconfig, vendor/umi_user_defconfig 等
        DEFCONFIG_NAME="umi_defconfig" 
        
        echo "Configuring kernel with $DEFCONFIG_NAME..."
        make $MAKE_ARGS $DEFCONFIG_NAME
        
        echo "Starting kernel compilation..."
        make $MAKE_ARGS -j$(nproc)

    - name: Check Build Output
      run: |
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          echo "Kernel compiled successfully!"
          mkdir -p out/
          cp arch/arm64/boot/Image.gz-dtb out/
        elif [ -f arch/arm64/boot/Image ]; then
          echo "Kernel compiled (Image only)!"
          mkdir -p out/
          cp arch/arm64/boot/Image out/
        else
          echo "Kernel build failed, output image not found."
          exit 1
        fi

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4  # <-- 修复了这里
      with:
        name: Xiaomi-SM8250-Kernel
        path: out/*
