name: Build Xiaomi SM8250 Kernel with ReSukiSU & SUSFS

on:
  push:
    branches: [ "staging-umi" ]
  pull_request:
    branches: [ "staging-umi" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      FINAL_ZIP_NAME: ""
      NO_DTB_ZIP_NAME: ""
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        ref: staging-umi
        fetch-depth: 1

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libelf-dev ccache flex bison libssl-dev libgmp-dev libmpfr-dev libmpc-dev libncurses-dev keyutils patch zip

    - name: Fetch ZyC-Clang 16 Toolchain
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain
        cd $GITHUB_WORKSPACE/toolchain
        curl -LO https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
        mkdir -p zyc-clang
        tar -xzf Clang-16.0.6-20260510.tar.gz -C zyc-clang

    - name: "PHASE 1: Apply SUSFS 4.19 Baseline Patch"
      run: |
        cd $GITHUB_WORKSPACE
        curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.19.patch" -o susfs_to_419.patch
        
        if [ -f "susfs_to_419.patch" ]; then
          patch -p1 < susfs_to_419.patch || echo "Notice: Some hunks failed. Catching rejections below..."
        fi

        echo "====================================================================="
        echo "    🔍 [PHASE 1 AUDIT ENGINE] PRINTING REJECTED HUNKS & MODIFICATIONS"
        echo "====================================================================="

        audit_phase1() {
          local file_path="$1"
          local name="$2"
          echo "---------------------------------------------------------------------"
          echo "  📝 CURRENT MODIFIED STATE FOR: ${name}"
          echo "---------------------------------------------------------------------"
          git diff "$file_path" || true
          
          echo "---------------------------------------------------------------------"
          echo "  ❌ REJECTED HUNK DETAILS (.rej) FOR: ${name}"
          echo "---------------------------------------------------------------------"
          if [ -f "${file_path}.rej" ]; then
            cat "${file_path}.rej"
          else
            echo "No rejections found for ${file_path} (Hunk applied or skipped cleanly)."
          fi
          echo "---------------------------------------------------------------------"
        }

        audit_phase1 "fs/open.c" "fs/open.c"
        audit_phase1 "fs/proc/task_mmu.c" "fs/proc/task_mmu.c"

        echo "====================================================================="
        echo "  ✅ [PHASE 1 AUDIT] Rejection Logging Complete. Ready for Rescue."
        echo "====================================================================="

    - name: "PHASE 1.5: Intercept & Manually Rescue Failed Hunks (Script Driven)"
      run: |
        cd $GITHUB_WORKSPACE
        
        # 清理无用的中间状态文件
        find . -name "*.orig" -delete

        # 执行拦截修复脚本
        if [ -f ".github/workflows/rescue_hunks.sh" ]; then
          chmod +x .github/workflows/rescue_hunks.sh
          ./.github/workflows/rescue_hunks.sh
        else
          echo "❌ CRITICAL: rescue_hunks.sh not found!" && exit 1
        fi

        # 运行完毕后删除 .rej 避免后续流程产生干扰
        find . -name "*.rej" -delete

        echo "====================================================================="
        echo "        🔍 [YML AUDIT ENGINE] VERIFYING PHASE 1.5 INTEGRITY CODES"
        echo "====================================================================="

        monitor_diff() {
          local file_path="$1"
          local patch_title="$2"
          echo "---------------------------------------------------------------------"
          echo "  🔍 MONITORING STATUS FOR: ${patch_title}"
          echo "---------------------------------------------------------------------"
          if [ -f "$file_path" ]; then
            git diff "$file_path" || true
          else
            echo "❌ ERROR: Target file ${file_path} does not exist!"
          fi
          echo "---------------------------------------------------------------------"
        }

        monitor_diff "fs/open.c" "fs/open.c Structural Injection"
        monitor_diff "fs/proc/task_mmu.c" "fs/proc/task_mmu.c Map Hooks"

        echo "====================================================================="
        echo "  ✅ [YML AUDIT ENGINE] Phase 1.5 Verification Finished and Validated!"
        echo "====================================================================="

    - name: "PHASE 2: Integrate Official ReSukiSU"
      run: |
        cd $GITHUB_WORKSPACE
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main || curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

    - name: "PHASE 3: Apply JackA1ltman Native Non-GKI Core Infrastructure"
      run: |
        cd $GITHUB_WORKSPACE
        curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh" -o susfs_inline_hook_patches.sh
        chmod +x susfs_inline_hook_patches.sh
        bash susfs_inline_hook_patches.sh || echo "Notice: VFS tree adaptation finished."

        monitor_diff() {
          local file_path="$1"
          local patch_title="$2"
          echo "---------------------------------------------------------------------"
          echo "  🔍 MONITORING: ${patch_title}"
          echo "---------------------------------------------------------------------"
          if [ -f "$file_path" ]; then
            git diff "$file_path" || true
          else
            echo "❌ ERROR: Target file ${file_path} does not exist!"
          fi
          echo "---------------------------------------------------------------------"
        }

        echo "====== FINAL SOURCE DUMP AUDIT ======"
        monitor_diff "fs/exec.c" "Final Check - fs/exec.c Inline Hook"
        monitor_diff "fs/open.c" "Final Check - fs/open.c Inline Hook"
        monitor_diff "fs/read_write.c" "Final Check - fs/read_write.c Inline Hook"
        monitor_diff "fs/stat.c" "Final Check - fs/stat.c Inline Hook"
        security_file="security/selinux/hooks.c"
        monitor_diff "$security_file" "Final Check - SELinux Hooks"
        monitor_diff "kernel/reboot.c" "Final Check - kernel/reboot.c Inline Hook"
        monitor_diff "kernel/sys.c" "Final Check - kernel/sys.c Inline Hook"
        monitor_diff "drivers/input/input.c" "Final Check - Input Device Hook"
        monitor_diff "include/linux/seccomp.h" "Final Check - seccomp Hook"
        echo "====== Final Audit Complete ======"

    - name: Build Kernel
      run: |
          cd $GITHUB_WORKSPACE
          
          # 1. 修复静态符号检查（ReSukiSU）限制
          if [ -f "security/selinux/selinuxfs.c" ]; then
            echo "Removing static prefix from sel_handle_status_ops..."
            sed -i 's/static const struct file_operations sel_handle_status_ops/const struct file_operations sel_handle_status_ops/g' security/selinux/selinuxfs.c
          fi
          
          # 2. 【核心注入】：将容错参数直接追加到顶层 Makefile 的 LDFLAGS_vmlinux 中
          # 这样可以完美避开命令行传参导致的 make: invalid option 语法错误
          if [ -f "Makefile" ]; then
            echo "Injecting LLVM backend flags into top-level Makefile..."
            echo 'LDFLAGS_vmlinux += -mllvm -mattr=+no-unpredictable-stxr' >> Makefile
          fi

          # 3. 锁定全套标准、干净的工具链环境变量
          export MAKE_ARGS="ARCH=arm64 \
                            SUBARCH=arm64 \
                            O=out \
                            CC=clang \
                            LD=ld.lld \
                            AR=llvm-ar \
                            NM=llvm-nm \
                            OBJCOPY=llvm-objcopy \
                            OBJDUMP=llvm-objdump \
                            STRIP=llvm-strip \
                            CROSS_COMPILE=aarch64-linux-gnu- \
                            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
                            LLVM=1 \
                            LLVM_IAS=1"

          # 4. 生成原始高通配置（此时 LTO 默认处于开启状态）
          make $MAKE_ARGS vendor/umi_defconfig
          
          # 5. 注入 KSU 和 SUSFS 的扩展项
          ./scripts/config --file out/.config \
              -e KSU \
              -e THREAD_INFO_IN_TASK \
              -e KSU_SUSFS \
              -e KSU_SUSFS_SUS_PATH \
              -e KSU_SUSFS_SUS_MOUNT \
              -e KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_SPOOF_UNAME \
              -e KSU_SUSFS_ENABLE_LOG \
              -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              -e KSU_SUSFS_OPEN_REDIRECT \
              -e KSU_SUSFS_SUS_MAP \
              -e KSU_MULTI_MANAGER_SUPPORT \
              -e BUILD_ARM64_DT_OVERLAY

          # 6. 同步 .config 依赖树
          make $MAKE_ARGS silentoldconfig

          # 7. 执行满载并行内核编译（带着完整的 LTO 冲锋）
          make $MAKE_ARGS -j$(nproc --all)



    - name: Pack Kernel with AnyKernel3 (Dual Output with DTBO)
      run: |
        cd $GITHUB_WORKSPACE
        BUILD_DATE=$(date -d "+8 hours" +%Y%m%d_%H%M)
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        
        ZIP_FULL="umi-kernel-resukisu-susfs-${BUILD_DATE}-${SHORT_SHA}-With-DTB.zip"
        ZIP_NODTB="umi-kernel-resukisu-susfs-${BUILD_DATE}-${SHORT_SHA}-No-DTB.zip"
        
        echo "FINAL_ZIP_NAME=${ZIP_FULL}" >> $GITHUB_ENV
        echo "NO_DTB_ZIP_NAME=${ZIP_NODTB}" >> $GITHUB_ENV
        
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3_with_dtb
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3_no_dtb
        
        rm -rf ak3_with_dtb/.git ak3_with_dtb/README.md ak3_with_dtb/Image* ak3_with_dtb/zImage*
        rm -rf ak3_no_dtb/.git ak3_no_dtb/README.md ak3_no_dtb/Image* ak3_no_dtb/zImage*
        
        define_properties() {
          local target_script="$1"
          local track_mode="$2"
          echo '# AnyKernel3 Ramdisk Mod Script' > "$target_script"
          echo 'properties() { ' >> "$target_script"
          echo "kernel.string=Mi10 umi ReSukiSU SUSFS - ${track_mode} - ${BUILD_DATE}" >> "$target_script"
          echo 'do.devicecheck=1; do.modules=0; do.systemless=1; do.cleanup=1; do.cleanuponabort=1;' >> "$target_script"
          echo "device.name1=umi" >> "$target_script"
          echo '} ' >> "$target_script"
          echo 'BLOCK=boot; IS_SLOT_DEVICE=0; RAMDISK_COMPRESSION=auto; PATCH_VBMETA_FLAG=auto;' >> "$target_script"
          echo '. /tmp/anykernel/tools/ak3-core.sh;' >> "$target_script"
          echo 'split_boot;' >> "$target_script"
          echo 'flash_boot;' >> "$target_script"
          if [ "$track_mode" = "With-DTB" ]; then
            if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
              echo 'flash_dtbo;' >> "$target_script"
            fi
          fi
        }
        
        define_properties "ak3_with_dtb/anykernel.sh" "With-DTB"
        define_properties "ak3_no_dtb/anykernel.sh" "No-DTB"

        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          cp out/arch/arm64/boot/Image.gz-dtb ak3_with_dtb/Image.gz-dtb
        else
          exit 1
        fi
        if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
          cp out/arch/arm64/boot/dtbo.img ak3_with_dtb/dtbo.img
        fi

        if [ -f "out/arch/arm64/boot/Image" ]; then
          gzip -c out/arch/arm64/boot/Image > ak3_no_dtb/Image.gz
        else
          exit 1
        fi

        cd ak3_with_dtb && zip -r ../${ZIP_FULL} * && cd ..
        cd ak3_no_dtb && zip -r ../${ZIP_NODTB} * && cd ..

    - name: Upload Both Kernel Zips
      uses: actions/upload-artifact@v4
      with:
        name: umi-compiled-kernels
        path: |
          ${{ env.FINAL_ZIP_NAME }}
          ${{ env.NO_DTB_ZIP_NAME }}
