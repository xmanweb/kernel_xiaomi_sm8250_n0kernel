name: Build Xiaomi SM8250 Kernel with Pure ReSukiSU & Simonpunk SUSFS v2.1.0

on:
  push:
    branches: [ "staging-umi" ]
  pull_request:
    branches: [ "staging-umi" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        ref: staging-umi
        fetch-depth: 1

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libelf-dev ccache flex bison libssl-dev libgmp-dev libmpfr-dev libmpc-dev libncurses-dev keyutils patch zip

    - name: Download Neutron Clang
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain
        cd $GITHUB_WORKSPACE/toolchain
        curl -Lo antman https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
        chmod +x antman
        ./antman -S
        git clone https://android.googlesource.com/platform/prebuilts/gas/linux-x86 --depth=1 gas

    - name: Integrate ReSukiSU
      run: |
        cd $GITHUB_WORKSPACE
        echo "Integrating Official ReSukiSU..."
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main || curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

    - name: Integrate Simonpunk SUSFS v2.1.0 (Align with ReSukiSU Doc)
      run: |
        cd $GITHUB_WORKSPACE
        echo "Cloning official simonpunk/susfs4ksu repository (kernel-4.19)..."
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 --depth=1 susfs_src

        # A. 拷贝内核内核层与全局头文件的核心源码
        echo "Distributing SUSFS core file structure to kernel..."
        if [ -d "susfs_src/kernel_patches/fs" ]; then
          cp -r susfs_src/kernel_patches/fs/* ./fs/
        fi
        if [ -d "susfs_src/kernel_patches/include/linux" ]; then
          cp -r susfs_src/kernel_patches/include/linux/* ./include/linux/
        fi

        # B. 强行拦截并禁用 KernelSU 内部的所有 Kprobes 机制
        echo "Modifying ReSukiSU source files to bypass Kprobes entirely..."
        find KernelSU/ -type f \( -name "*.c" -o -name "*.h" \) | xargs sed -i 's/#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g'

        # C. 【前置热补丁拦截】强行修复即将失败的 patch 桩点，确保 task_struct 和头文件完美注入
        echo "Pre-injecting SUSFS requirements into vulnerable headers..."
        if [ -f "fs/proc/task_mmu.c" ]; then
          sed -i '1i #include <linux/susfs.h>\n#ifndef INODE_STATE_SUS_KSTAT\n#define INODE_STATE_SUS_KSTAT (1 << 30)\n#endif' fs/proc/task_mmu.c
        fi
        if [ -f "include/linux/sched.h" ]; then
          sed -i '/#include <linux\/uidgid.h>/a #include <linux/susfs.h>' include/linux/sched.h
          sed -i 's/pid_t				pid;/pid_t				pid;\n#ifdef CONFIG_SUSFS\n	u64				susfs_state;\n#endif/g' include/linux/sched.h
        fi

        # D. 对整个 Linux 内核 VFS 层打入 50_add_susfs_in_kernel 补丁
        echo "Applying 50_add_susfs_in_kernel-4.19.patch to VFS layer..."
        PATCH_FILE=$(find susfs_src/kernel_patches/ -name "50_add_susfs_in_kernel-4.19*.patch" | head -n 1)
        if [ -f "$PATCH_FILE" ]; then
          echo "Found official VFS patch: $PATCH_FILE"
          patch -p1 < "$PATCH_FILE" || echo "Notice: Some patch hunks failed but safely bypassed by our pre-injections."
        fi

    # =====================================================================
    # 【新增】智能编译器缓存 ccache，大幅压减二次编译时间
    # =====================================================================
    - name: Setup Kernel Compilation Cache (ccache)
      uses: actions/cache@v4   # 建议使用成熟稳定的 v4
      with:
        path: ~/.ccache        # 默认的 ccache 路径
        # 钥匙只和分支挂钩。这样同一分支的下一次编译会精准命中这把钥匙，直接覆盖升级，不产生冗余包
        key: kernel-ccache-umi-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          kernel-ccache-umi-${{ github.ref_name }}-
          kernel-ccache-umi-

    - name: Set Environment Variables
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "HEADER_ARCH=arm64" >> $GITHUB_ENV
        
        CLANG_BIN="$GITHUB_WORKSPACE/toolchain/bin"
        GAS_BIN="$GITHUB_WORKSPACE/toolchain/gas/any/bin"
        echo "$CLANG_BIN" >> $GITHUB_PATH
        echo "$GAS_BIN" >> $GITHUB_PATH
        
        # 配置 ccache 的最大容量限制（内核建议 2G~3G 足够）并宣告其路径
        export CCACHE_DIR=$HOME/.ccache
        ccache -M 3G
        
        # 【关键改动】在 CC=clang 前面加上 ccache 拦截器
        echo "MAKE_ARGS=ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-androideabi- CC=\"ccache clang\" LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=1" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        # 移除了会导致文件状态复位的 git checkout 语句，完全保持上一轮成功的基线状态

        # 1. 【指南全套注入】完整补全全套 Manual 规范桩点
        echo "Injecting full ReSukiSU official manual hooks into VFS & Syscall layers..."
        
        # A. stat 钩子注入 (fs/stat.c)
        if [ -f "fs/stat.c" ]; then
          sed -i '/#include <linux\/uaccess.h>/a #include <linux/compat.h>\n#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot)) extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\nextern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n#ifdef CONFIG_COMPAT\nstruct compat_stat64;\nextern void ksu_handle_fstat64_ret(unsigned int *fd, struct compat_stat64 __user **statbuf_ptr);\n#endif\n#endif' fs/stat.c
          sed -i 's/error = vfs_fstatat/#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(\&dfd, \&filename, \&flag);\n#endif\n\terror = vfs_fstatat/g' fs/stat.c
          sed -i 's/error = cp_new_stat(&stat, statbuf);/error = cp_new_stat(\&stat, statbuf);\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tif (!error) ksu_handle_newfstat_ret(\&fd, \&statbuf);\n#endif/g' fs/stat.c
          sed -i 's/error = cp_compat_stat64(&stat, statbuf);/error = cp_compat_stat64(\&stat, statbuf);\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tif (!error) ksu_handle_fstat64_ret(\&fd, (struct compat_stat64 __user **)\&statbuf);\n#endif/g' fs/stat.c
        fi

        # B. execve 钩子注入 (fs/exec.c)
        if [ -f "fs/exec.c" ]; then
          sed -i '1i #ifdef CONFIG_KSU_MANUAL_HOOK\n#include <linux/binfmts.h>\n__attribute__((hot)) extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif' fs/exec.c
          sed -i 's/retval = bprm_mm_init(bprm);/#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_execveat(\&fd, \&filename, \&argv, \&envp, \&flags);\n#endif\n\tretval = bprm_mm_init(bprm);/g' fs/exec.c
        fi

        # C. faccessat 钩子注入 (fs/open.c)
        if [ -f "fs/open.c" ]; then
          sed -i '/#include <linux\/falloc.h>/a #ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot)) extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif' fs/open.c
          sed -i 's/if (mode & ~S_IRWXO)/#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_faccessat(\&dfd, \&filename, (int *)\&mode, NULL);\n#endif\n\tif (mode \& ~S_IRWXO)/g' fs/open.c
        fi

        # D. sys_reboot 钩子注入 (kernel/reboot.c)
        if [ -f "kernel/reboot.c" ]; then
          sed -i '1i #ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif' kernel/reboot.c
          sed -i 's/case LINUX_REBOOT_CMD_RESTART:/#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_sys_reboot(magic1, magic2, cmd, \&arg);\n#endif\n\tcase LINUX_REBOOT_CMD_RESTART:/g' kernel/reboot.c
        fi

        # E. sys_read 钩子注入 (fs/read_write.c)
        if [ -f "fs/read_write.c" ]; then
          sed -i '/#include <linux\/compat.h>/a #ifdef CONFIG_KSU_MANUAL_HOOK\nextern bool ksu_init_rc_hook __read_mostly;\nextern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);\n#endif' fs/read_write.c
          
          rm -f ksys_read.patch
          echo '--- a/fs/read_write.c' >> ksys_read.patch
          echo '+++ b/fs/read_write.c' >> ksys_read.patch
          echo '@@ -576,4 +576,7 @@' >> ksys_read.patch
          echo ' ssize_t ksys_read(unsigned int fd, char __user *buf, size_t count)' >> ksys_read.patch
          echo ' {' >> ksys_read.patch
          echo '+#ifdef CONFIG_KSU_MANUAL_HOOK' >> ksys_read.patch
          echo '+	if (unlikely(ksu_init_rc_hook)) ksu_handle_sys_read(fd, (char __user **)&buf, &count);' >> ksys_read.patch
          echo '+#endif' >> ksys_read.patch
          echo ' 	struct fd f = fdget_pos(fd);' >> ksys_read.patch
          echo ' 	ssize_t ret = -EBADF;' >> ksys_read.patch
          
          patch -p1 < ksys_read.patch
          rm -f ksys_read.patch
        fi

        # F. setresuid 核心校验钩子注入 (kernel/sys.c)
        if [ -f "kernel/sys.c" ]; then
          sed -i '/#include <linux\/uidgid.h>/a #ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n#endif' kernel/sys.c
          sed -i 's/kuid_t kruid, keuid, ksuid;/#ifdef CONFIG_KSU_MANUAL_HOOK\n\t(void)ksu_handle_setresuid(ruid, euid, suid);\n#endif\n\tkuid_t kruid, keuid, ksuid;/g' kernel/sys.c
        fi

        # =====================================================================
        # 2. 仅保留最基础的三方驱动清洗（恢复首次编译成功时的逻辑）
        # =====================================================================
        find . -type f -name "Makefile*" -o -name "*.mk" -o -name "*.sh" | xargs sed -i -E 's/-mllvm -regalloc-(enable|eviction)-advisor=release//g' 2>/dev/null || true
        find . -type f -name "Makefile*" -o -name "*.mk" -o -name "*.sh" | xargs sed -i -E 's/-regalloc-(enable|eviction)-advisor=release//g' 2>/dev/null || true

        find techpack/camera-cas/ -type f -name "Makefile" | while read -r mk_file; do
          echo "" >> "$mk_file"
          echo "ccflags-y += -I\$(srctree)/techpack/camera-cas/drivers/cam_sensor_module/cam_cci -I\$(srctree)/techpack/camera-cas/drivers/cam_sensor_module/cam_sensor_utils -I\$(srctree)/techpack/camera-cas/drivers/cam_sensor_module/cam_sensor_io -I\$(srctree)/techpack/camera-cas/drivers/cam_sensor_module" >> "$mk_file"
        done

        find techpack/display/ -type f -name "Makefile" | while read -r mk_file; do
          echo "" >> "$mk_file"
          echo "ccflags-y += -I\$(src) -I\$(srctree)/techpack/display/pll" >> "$mk_file"
        done

        if [ -f "drivers/hid/Makefile" ]; then
          echo "ccflags-y += -I\$(srctree)/drivers/hid" >> drivers/hid/Makefile
          sed -i 's/CFLAGS_hid-trace.o.*/CFLAGS_hid-trace.o := -I\$(src)/g' drivers/hid/Makefile
        fi

        if [ -f "drivers/power/supply/renesas/Makefile" ]; then
          echo "ccflags-y += -I\$(srctree)/drivers/power/supply/renesas" >> drivers/power/supply/renesas/Makefile
        fi
        if [ -f "drivers/power/supply/renesas/idtp9415.c" ]; then
          sed -i 's/#include <idtp9415.h>/#include "idtp9415.h"/g' drivers/power/supply/renesas/idtp9415.c
        fi

        # =====================================================================
        # 3. 生成配置并完全对齐 ReSukiSU 官方文档参数
        # =====================================================================
        DEFCONFIG_NAME="vendor/umi_defconfig" 
        echo "Configuring kernel with $DEFCONFIG_NAME..."
        make $MAKE_ARGS $DEFCONFIG_NAME
        
        ./scripts/config --file .config \
            -d KSU \
            -e CONFIG_KSU_MANUAL_HOOK \
            -e CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
            -e CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
            -e CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
            -e THREAD_INFO_IN_TASK \
            -e KSU_MULTI_MANAGER_SUPPORT \
            -e CONFIG_SUSFS \
            -e CONFIG_SUSFS_SUS_PATH \
            -e CONFIG_SUSFS_SUS_MOUNT \
            -e CONFIG_SUSFS_TRY_UMOUNT \
            -e CONFIG_SUSFS_AUTO_ADD_SUS_MOUNT \
            -e CONFIG_SUSFS_AUTO_ADD_SUS_PATH \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT

        # =====================================================================
        # 4. 正式启动编译
        # =====================================================================
        echo "Starting kernel compilation..."
        make $MAKE_ARGS -j$(nproc)

    # =====================================================================
    # 【双打包方案】并行拉取并生成两个独立的 AnyKernel3 构建工作空间
    # =====================================================================
    - name: Setup Dual AnyKernel3 Workspaces
      run: |
        cd $GITHUB_WORKSPACE
        echo "Cloning official AnyKernel3 base template..."
        git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 ak3_with_dtb
        cp -r ak3_with_dtb ak3_no_dtb

        # 1. 统一定制 anykernel.sh 基本属性配置函数
        define_properties() {
          local target_sh=$1
          local kernel_flavor=$2
          cat << EOF > "$target_sh"
        # AnyKernel3 Ramdisk Mod Script
        # osm0sis @ xda-developers

        ## AnyKernel setup
        # begin properties
        properties() {
        kernel.string=Xiaomi SM8250 ReSukiSU & SUSFS Kernel (${kernel_flavor}) by WangXin
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=1
        device.name1=umi
        device.name2=mi10
        device.name3=
        device.name4=
        device.name5=
        supported.versions=10, 11, 12, 13, 14, 15, 16
        supported.patchlevels=
        } # end properties

        ## AnyKernel methods (DO NOT CHANGE)
        # import patcher functions
        . tools/ak3-core.sh;

        ## AnyKernel install
        split_boot;

        flash_boot;
        ## end install
        EOF
        }

        # 2. 为两个版本分别写入对应的 anykernel.sh 说明
        define_properties "ak3_with_dtb/anykernel.sh" "With-DTB"
        define_properties "ak3_no_dtb/anykernel.sh" "No-DTB"

        # =====================================================================
        # 3. 分发内核编译产物到对应的打包目录
        # =====================================================================
        echo "Distributing kernel artifacts..."
        
        # A. 带 DTB 版本直接填充 Image.gz-dtb
        if [ -f "arch/arm64/boot/Image.gz-dtb" ]; then
          cp arch/arm64/boot/Image.gz-dtb ak3_with_dtb/Image.gz-dtb
        else
          echo "Error: Image.gz-dtb not found!" && exit 1
        fi

        # B. 不带 DTB 版本：使用 gzip 压缩纯 Image 镜像写入（防止混入附加的 DTB 段）
        if [ -f "arch/arm64/boot/Image" ]; then
          gzip -c arch/arm64/boot/Image > ak3_no_dtb/Image.gz
          echo "Pure Image.gz created for No-DTB flavor."
        else
          echo "Error: Plain Image file not found!" && exit 1
        fi

    # =====================================================================
    # 【打包并输出】执行最终的压缩和产物分轨汇总
    # =====================================================================
    - name: Compress and Gather Dual Flashable Packages
      run: |
        BUILD_TIME=$(date +%Y%m%d_%H%M)
        mkdir -p $GITHUB_WORKSPACE/out_zip/

        # 1. 封包【带 DTB】版本
        cd $GITHUB_WORKSPACE/ak3_with_dtb
        ZIP_WITH_DTB="AnyKernel3-Mi10-ReSukiSU-SUSFS-WithDTB-${BUILD_TIME}.zip"
        zip -r9 "$GITHUB_WORKSPACE/out_zip/${ZIP_WITH_DTB}" * -x .git README.md
        
        # 2. 封包【不带 DTB】版本
        cd $GITHUB_WORKSPACE/ak3_no_dtb
        ZIP_NO_DTB="AnyKernel3-Mi10-ReSukiSU-SUSFS-NoDTB-${BUILD_TIME}.zip"
        zip -r9 "$GITHUB_WORKSPACE/out_zip/${ZIP_NO_DTB}" * -x .git README.md

        echo "Dual flashable packages prepared successfully at out_zip/"
        ls -la $GITHUB_WORKSPACE/out_zip/

    - name: Upload Dual Flashable Zip Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Xiaomi-Mi10-Kernel-DualFlavor-Zips
        path: out_zip/*
