name: Build Xiaomi SM8250 Kernel with ReSukiSU & SUSFS

on:
  push:
    branches: [ "staging-umi" ]
  pull_request:
    branches: [ "staging-umi" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        ref: staging-umi
        fetch-depth: 1

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libelf-dev ccache flex bison libssl-dev libgmp-dev libmpfr-dev libmpc-dev libncurses-dev keyutils

    - name: Download Neutron Clang
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain
        cd $GITHUB_WORKSPACE/toolchain
        curl -Lo antman https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
        chmod +x antman
        ./antman -S
        git clone https://android.googlesource.com/platform/prebuilts/gas/linux-x86 --depth=1 gas

    - name: Integrate ReSukiSU
      run: |
        cd $GITHUB_WORKSPACE
        echo "Integrating Official ReSukiSU..."
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

    - name: Apply SUSFS Patches
      run: |
        cd $GITHUB_WORKSPACE
        echo "Applying SUSFS Patches..."
        mkdir -p susfs_src
        cd susfs_src
        git clone https://gitlab.com/simonpunk/susfs4ksu.git --depth=1
        cd $GITHUB_WORKSPACE
        
        # 拷贝内核 4.19 的标准 SUSFS 核心文件
        cp susfs_src/susfs4ksu/kernel_patches/fs/susfs.c fs/
        cp susfs_src/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
        
        # 打入底层结构体补丁
        if [ -f "susfs_src/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch" ]; then
          patch -p1 < susfs_src/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || echo "Kernel patch warning"
        fi
        
        # 打入与 KSU/ReSukiSU 联动的补丁
        if [ -f "susfs_src/susfs4ksu/kernel_patches/KernelSU/10_add_susfs_in_ksu.patch" ]; then
          patch -p1 < susfs_src/susfs4ksu/kernel_patches/KernelSU/10_add_susfs_in_ksu.patch || echo "KSU patch warning"
        fi

    - name: Set Environment Variables
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "HEADER_ARCH=arm64" >> $GITHUB_ENV
        
        CLANG_BIN="$GITHUB_WORKSPACE/toolchain/bin"
        GAS_BIN="$GITHUB_WORKSPACE/toolchain/gas/any/bin"
        echo "$CLANG_BIN" >> $GITHUB_PATH
        echo "$GAS_BIN" >> $GITHUB_PATH
        
        echo "MAKE_ARGS=ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-androideabi- CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=1" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        # 1. 【核心修复 1】强行在内核核心 Kconfig 里将 KALLSYMS_ALL 设为默认开启
        echo "Forcing CONFIG_KALLSYMS_ALL inside init/Kconfig..."
        if [ -f "init/Kconfig" ]; then
          sed -i '/config KALLSYMS_ALL/,/bool/ {/bool/s/bool.*/bool "EXPORT ALL SYMBOLS" default y/}' init/Kconfig
        fi

        # 2. 【核心修复 2】针对 ReSukiSU 要求的 sel_handle_status_ops 进行手术级强制导出
        echo "Forcing export of sel_handle_status_ops in selinuxfs.c..."
        SELINUX_FILE="security/selinux/selinuxfs.c"
        if [ -f "$SELINUX_FILE" ]; then
          echo "" >> "$SELINUX_FILE"
          echo "/* Added by Actions for ReSukiSU */" >> "$SELINUX_FILE"
          echo "#include <linux/export.h>" >> "$SELINUX_FILE"
          echo "extern const struct file_operations sel_handle_status_ops;" >> "$SELINUX_FILE"
          echo "EXPORT_SYMBOL_GPL(sel_handle_status_ops);" >> "$SELINKS_FILE" || echo "EXPORT_SYMBOL(sel_handle_status_ops);" >> "$SELINUX_FILE"
        fi

        # 3. 深度清洗陈旧的 MLGO 寄存器分配优化参数
        find . -type f -name "Makefile*" -o -name "*.mk" -o -name "*.sh" | xargs sed -i -E 's/-mllvm -regalloc-(enable|eviction)-advisor=release//g' 2>/dev/null || true
        find . -type f -name "Makefile*" -o -name "*.mk" -o -name "*.sh" | xargs sed -i -E 's/-regalloc-(enable|eviction)-advisor=release//g' 2>/dev/null || true

        # 4. 修复相机、显示及无线充驱动在 Clang 18 下的路径寻址
        find techpack/camera-cas/ -type f -name "Makefile" | while read -r mk_file; do
          echo "" >> "$mk_file"
          echo "ccflags-y += -I\$(srctree)/techpack/camera-cas/drivers/cam_sensor_module/cam_cci -I\$(srctree)/techpack/camera-cas/drivers/cam_sensor_module/cam_sensor_utils -I\$(srctree)/techpack/camera-cas/drivers/cam_sensor_module/cam_sensor_io -I\$(srctree)/techpack/camera-cas/drivers/cam_sensor_module" >> "$mk_file"
        done

        find techpack/display/ -type f -name "Makefile" | while read -r mk_file; do
          echo "" >> "$mk_file"
          echo "ccflags-y += -I\$(src) -I\$(srctree)/techpack/display/pll" >> "$mk_file"
        done

        if [ -f "drivers/hid/Makefile" ]; then
          echo "ccflags-y += -I\$(srctree)/drivers/hid" >> drivers/hid/Makefile
          sed -i 's/CFLAGS_hid-trace.o.*/CFLAGS_hid-trace.o := -I\$(src)/g' drivers/hid/Makefile
        fi

        if [ -f "drivers/power/supply/renesas/Makefile" ]; then
          echo "ccflags-y += -I\$(srctree)/drivers/power/supply/renesas" >> drivers/power/supply/renesas/Makefile
        fi
        if [ -f "drivers/power/supply/renesas/idtp9415.c" ]; then
          sed -i 's/#include <idtp9415.h>/#include "idtp9415.h"/g' drivers/power/supply/renesas/idtp9415.c
        fi

        # 5. 释放并生成基础的 .config 配置
        DEFCONFIG_NAME="vendor/umi_defconfig" 
        echo "Configuring kernel with $DEFCONFIG_NAME..."
        make $MAKE_ARGS $DEFCONFIG_NAME
        
        # 6. 使用 scripts/config 动态注入高级参数
        echo "Injecting ReSukiSU and SUSFS advanced features into .config..."
        ./scripts/config --file .config \
            -e KSU \
            -e THREAD_INFO_IN_TASK \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e KSU_SUSFS_OPEN_REDIRECT \
            -e KSU_SUSFS_SUS_MAP \
            -e KSU_MULTI_MANAGER_SUPPORT \
            -e CONFIG_SUSFS \
            -e CONFIG_SUSFS_SHOW_ROOT_SUS_PATH \
            -e CONFIG_KALLSYMS_ALL \
            -e CONFIG_KALLSYMS

        # 7. 正式动工编译
        echo "Starting kernel compilation..."
        make $MAKE_ARGS -j$(nproc)
        
    - name: Check Build Output
      run: |
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          echo "Kernel compiled successfully!"
          mkdir -p out/
          cp arch/arm64/boot/Image.gz-dtb out/
        elif [ -f arch/arm64/boot/Image ]; then
          echo "Kernel compiled (Image only)!"
          mkdir -p out/
          cp arch/arm64/boot/Image out/
        else
          echo "Kernel build failed, output image not found."
          exit 1
        fi

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Xiaomi-SM8250-ReSukiSU-SUSFS
        path: out/*
